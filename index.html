<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周历视图 - 第10周到第43周</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#60a5fa',
                        accent: '#2563eb',
                        neutral: '#f3f4f6',
                        'neutral-dark': '#e5e7eb',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'calendar': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .calendar-grid {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                gap: 1px;
                font-size: 0.85rem;
            }
            @media (max-width: 639px) {
                .calendar-grid {
                    font-size: 0.75rem;
                }
            }
            .calendar-day {
                @apply flex flex-col items-center justify-center p-1 transition-all duration-200 cursor-pointer min-h-[60px] bg-white;
            }
            @media (min-width: 640px) {
                .calendar-day {
                    @apply aspect-square min-h-[80px];
                }
            }
            .calendar-day:hover {
                @apply bg-neutral rounded-md;
            }
            /* 仅高亮系统当天 */
            .calendar-day.today {
                @apply bg-primary text-white font-bold rounded-md ring-2 ring-accent;
            }
            .calendar-day.has-note {
                @apply relative;
            }
            .tab-btn {
                @apply px-4 py-2 text-sm font-medium text-gray-500 border-b-2 border-transparent cursor-pointer transition-colors duration-200;
            }
            .tab-btn:hover {
                @apply text-gray-700;
            }
            .tab-btn.active {
                @apply text-primary border-primary;
            }
            .tab-panel {
                display: block;
            }
            .tab-panel.hidden-panel {
                display: none;
            }

            .calendar-day.has-note::after {
                content: '';
                @apply absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full;
            }
            .week-header {
                @apply text-sm font-medium text-gray-600 py-2 text-center;
            }
            @media (max-width: 639px) {
                .week-header {
                    @apply text-xs py-1;
                }
            }
            .bp-grid {
                display: grid;
                grid-template-columns: 4.5rem 1fr 1fr;
                gap: 1px;
                font-size: 0.85rem;
            }
            @media (min-width: 640px) {
                .bp-grid {
                    grid-template-columns: 5.5rem 1fr 1fr;
                }
            }
            .bp-header {
                @apply text-xs font-medium text-gray-500 py-2 text-center bg-gray-50;
            }
            .bp-cell {
                @apply flex flex-col items-center justify-center p-1 min-h-[40px] bg-white text-sm cursor-pointer transition-colors duration-200;
            }
            .bp-cell:hover {
                @apply bg-neutral;
            }
            .bp-cell.label-cell {
                @apply cursor-default;
            }
            .bp-cell.label-cell:hover {
                @apply bg-white;
            }
            .bp-cell .bp-value {
                @apply text-gray-800 font-medium;
            }
            .bp-cell .bp-value.missing {
                @apply text-gray-300 font-normal;
            }
            .bp-cell .bp-value.bp-high {
                @apply text-red-600 font-medium;
            }
            .bp-cell .bp-value.bp-normal {
                @apply text-green-600 font-medium;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-2 sm:px-4 py-4">
        <div class="sticky top-0 z-10 bg-gray-50 flex gap-1 mb-4 border-b border-gray-200 items-center" style="padding-top: 4px;">
            <button class="tab-btn active" data-tab="1">周历</button>
            <button class="tab-btn" data-tab="2">血压</button>
            <button class="tab-btn" data-tab="3">成长</button>
            <button class="tab-btn" data-tab="5">待办清单</button>
            <div class="flex-1"></div>
        </div>

        <div id="reminder-banner" class="hidden mb-4 space-y-2"></div>

        <div class="bg-white rounded-lg shadow-calendar p-3 sm:p-6">
            <div id="tab-panel-1" class="tab-panel">
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-1">周历视图</h1>
                <p class="text-gray-600 mb-3 sm:mb-4">5月12日为第10周第2天</p>
                <h2 class="text-lg sm:text-xl font-semibold text-gray-800 mb-3 sm:mb-4">第10周 ～ 第43周</h2>

                <div id="pregnancy-stats" class="bg-neutral border border-gray-200 rounded-lg p-3 sm:p-4 mb-3 sm:mb-4">
                    <div class="flex flex-wrap items-center gap-x-5 gap-y-1">
                        <span id="preg-week" class="text-base sm:text-lg font-bold text-gray-800"></span>
                        <span id="preg-edd" class="text-sm text-gray-600"></span>
                        <span id="preg-countdown" class="text-sm font-medium text-primary"></span>
                    </div>
                    <div class="mt-2 bg-white rounded-full h-2.5 overflow-hidden">
                        <div id="preg-progress" class="h-full bg-gradient-to-r from-primary to-secondary rounded-full transition-all duration-500" style="width:0%"></div>
                    </div>
                </div>

            <div class="calendar-grid mb-1">
                <div class="week-header">周一</div>
                <div class="week-header">周二</div>
                <div class="week-header">周三</div>
                <div class="week-header">周四</div>
                <div class="week-header">周五</div>
                <div class="week-header">周六</div>
                <div class="week-header">周日</div>
            </div>

            <div id="calendar-container" class="space-y-4 sm:space-y-6">
            </div>
        </div>
        <div id="tab-panel-2" class="tab-panel hidden-panel">
            <div class="flex items-center justify-between mb-1">
                <h2 class="text-lg sm:text-xl font-semibold text-gray-800">血压记录</h2>
                <div class="flex items-center gap-2">
                    <button id="bp-chart-toggle-btn" class="text-gray-400 hover:text-gray-600 transition-colors" title="血压趋势">
                        <i class="fa fa-area-chart"></i>
                    </button>
                    <button id="bp-settings-btn" class="text-gray-400 hover:text-gray-600 transition-colors" title="设置血压上限">
                        <i class="fa fa-cog"></i>
                    </button>
                </div>
            </div>
            <p class="text-sm text-gray-500 mb-4">记录每日早晚血压值（高压/低压）</p>
            <div id="bp-settings-panel" class="hidden mb-4 p-3 bg-gray-50 rounded-lg border border-gray-200">
                <div class="flex items-center gap-4">
                    <label class="flex items-center gap-2 text-sm">
                        <span class="text-gray-600">高压上限</span>
                        <input id="bp-high-limit" type="number" min="80" max="250" class="w-20 border border-gray-300 rounded p-1 text-sm text-center focus:outline-none focus:ring-2 focus:ring-primary">
                    </label>
                    <label class="flex items-center gap-2 text-sm">
                        <span class="text-gray-600">低压上限</span>
                        <input id="bp-low-limit" type="number" min="40" max="180" class="w-20 border border-gray-300 rounded p-1 text-sm text-center focus:outline-none focus:ring-2 focus:ring-primary">
                    </label>
                    <button id="bp-save-limit" class="px-3 py-1.5 bg-primary text-white text-sm rounded hover:bg-accent transition-colors">保存</button>
                </div>
            </div>
            <div id="bp-chart-section" class="mb-4 hidden">
                <h3 class="text-base font-semibold text-gray-700 mb-2">血压趋势</h3>
                <div class="relative bg-white border border-gray-200 rounded-lg p-2">
                    <canvas id="bp-chart"></canvas>
                </div>
            </div>
            <div id="bp-container" class="space-y-4"></div>
        </div>
        <div id="tab-panel-3" class="tab-panel hidden-panel">
            <div class="flex items-center justify-between mb-1">
                <h2 class="text-lg sm:text-xl font-semibold text-gray-800">成长记录</h2>
                <button id="growth-add-btn" class="px-3 py-1.5 bg-primary text-white text-sm rounded hover:bg-accent transition-colors">
                    <i class="fa fa-plus"></i> 添加
                </button>
            </div>
            <p class="text-sm text-gray-500 mb-4">记录每次B超检查的胎儿发育数据（单位：mm）</p>
            
            <!-- 曲线图区域 -->

                <h3 class="text-base font-semibold text-gray-700 mb-3">发育曲线</h3>

                    <canvas id="growth-chart"></canvas>
                </div>
            </div>

            <div id="growth-container" class="space-y-4"></div>
        </div>
        <div id="tab-panel-5" class="tab-panel hidden-panel">

                        <i class="fa fa-plus"></i> 添加
                    </button>
                    <button id="checklist-manage-btn" class="text-gray-400 hover:text-gray-600 transition-colors" title="管理分类和物品">

                    </button>

            </div>
            <p class="text-sm text-gray-500 mb-4">宝宝出生后必备物品，勾选已准备好的</p>
            <div id="checklist-progress" class="mb-4"></div>
            <div id="checklist-container" class="space-y-4"></div>

    </div>

    <div class="mt-6 bg-white rounded-lg shadow-calendar p-3 sm:p-4">
            <h3 class="text-base sm:text-lg font-semibold text-gray-800 mb-2">图例说明</h3>
            <div class="flex flex-wrap gap-3 text-sm">
                <div class="flex items-center">
                    <div class="w-3 h-3 bg-primary rounded mr-2"></div>
                    <span>今日</span>
                </div>
                <div class="flex items-center">
                    <div class="w-3 h-3 bg-red-500 rounded mr-2"></div>
                    <span>有备注</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 备注弹窗 -->
    <div id="note-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-md mx-3 p-4">
            <div class="flex justify-between items-center mb-3">
                <h3 id="modal-title" class="text-lg font-semibold text-gray-800">备注</h3>

            <div class="flex justify-end gap-2">
                <button id="delete-note" class="px-3 py-2 bg-red-500 text-white rounded hidden">删除</button>
                <button id="save-note" class="px-3 py-2 bg-primary text-white rounded">保存</button>
            </div>
        </div>
    </div>

    <!-- 血压记录弹窗 -->
    <div id="bp-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-sm mx-3 p-4">
            <div class="flex justify-between items-center mb-3">
                <h3 id="bp-modal-title" class="text-lg font-semibold text-gray-800">血压记录</h3>
                <button id="close-bp-modal" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>

                    <div class="flex gap-2 items-center">
                        <input id="bp-morning-high" type="number" min="50" max="280" placeholder="高压" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                        <span class="text-gray-400 text-sm shrink-0">/</span>
                        <input id="bp-morning-low" type="number" min="20" max="180" placeholder="低压" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">晚上</label>
                    <div class="flex gap-2 items-center">
                        <input id="bp-evening-high" type="number" min="50" max="280" placeholder="高压" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                        <span class="text-gray-400 text-sm shrink-0">/</span>
                        <input id="bp-evening-low" type="number" min="20" max="180" placeholder="低压" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-2">
                <button id="delete-bp" class="px-3 py-2 bg-red-500 text-white rounded hidden">删除</button>

        </div>
    </div>

    <!-- 成长记录弹窗 -->
    <div id="growth-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-sm mx-3 p-4">
            <div class="flex justify-between items-center mb-3">
                <h3 id="growth-modal-title" class="text-lg font-semibold text-gray-800">成长记录</h3>
                <button id="close-growth-modal" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="space-y-3 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">检查日期</label>
                    <input id="growth-date" type="date" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">孕周</label>
                    <input id="growth-week" type="text" placeholder="如：24+2" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">双顶径 BPD</label>
                        <input id="growth-bpd" type="number" step="0.1" min="0" placeholder="mm" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">头围 HC</label>
                        <input id="growth-hc" type="number" step="0.1" min="0" placeholder="mm" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">腹围 AC</label>
                        <input id="growth-ac" type="number" step="0.1" min="0" placeholder="mm" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">股骨长 FL</label>
                        <input id="growth-fl" type="number" step="0.1" min="0" placeholder="mm" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">羊水最大深度</label>
                        <input id="growth-afd" type="number" step="0.1" min="0" placeholder="mm" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">宫颈长</label>
                        <input id="growth-cl" type="number" step="0.1" min="0" placeholder="mm" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">胎盘厚</label>
                        <input id="growth-pl" type="number" step="0.1" min="0" placeholder="mm" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-2">
                <button id="delete-growth" class="px-3 py-2 bg-red-500 text-white rounded hidden">删除</button>
                <button id="save-growth" class="px-3 py-2 bg-primary text-white rounded">保存</button>
            </div>

    <!-- 添加物品弹窗 -->
    <div id="checklist-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-sm mx-3 p-4">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-lg font-semibold text-gray-800">添加物品</h3>
                <button id="close-checklist-modal" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="space-y-3 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">所属分类</label>
                    <select id="checklist-category" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">物品名称</label>
                    <input id="checklist-item-name" type="text" maxlength="30" placeholder="输入物品名称" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
            </div>
            <div class="flex justify-end gap-2">
                <button id="save-checklist-item" class="px-3 py-2 bg-primary text-white rounded">保存</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const calendarContainer = document.getElementById('calendar-container');
            const noteModal = document.getElementById('note-modal');
            const modalTitle = document.getElementById('modal-title');
            const noteContent = document.getElementById('note-content');
            const saveNoteBtn = document.getElementById('save-note');
            const deleteNoteBtn = document.getElementById('delete-note');
            const closeModalBtn = document.getElementById('close-modal');

            const START_WEEK = 10;
            const END_WEEK = 43;

            // 固定5月12日 为第10周第2天(周二)
            const fixedDay = new Date();
            fixedDay.setMonth(4);
            fixedDay.setDate(12);
            fixedDay.setHours(0,0,0,0);

            // 系统今天
            const today = new Date();
            today.setHours(0,0,0,0);

            // 第10周周一
            let week10Monday = new Date(fixedDay);
            week10Monday.setDate(fixedDay.getDate() - 1);

            let notes = JSON.parse(localStorage.getItem('calendarNotes')) || {};
            let selectedDate = null;

            function generateAllWeeks() {
                calendarContainer.innerHTML = '';

                for (let w = START_WEEK; w <= END_WEEK; w++) {
                    let weekStart = new Date(week10Monday);
                    weekStart.setDate(week10Monday.getDate() + (w - 10) * 7);

                    let weekWrap = document.createElement('div');
                    weekWrap.className = 'mb-4';

                    let weekTitle = document.createElement('h3');
                    weekTitle.className = 'text-base sm:text-lg font-medium text-gray-700 mb-2';
                    weekTitle.innerText = `第${w}周`;
                    weekWrap.appendChild(weekTitle);

                    let grid = document.createElement('div');
                    grid.className = 'calendar-grid bg-neutral-dark';

                    for (let d = 0; d < 7; d++) {
                        let curDate = new Date(weekStart);
                        curDate.setDate(weekStart.getDate() + d);
                        let dayNo = d + 1;

                        addDayCell(grid, curDate, w, dayNo);
                    }

                    weekWrap.appendChild(grid);
                    calendarContainer.appendChild(weekWrap);
                }
            }

            function addDayCell(grid, date, week, dayNo) {
                let cell = document.createElement('div');
                cell.className = 'calendar-day';

                // 只高亮系统当天
                const isToday = date.getTime() === today.getTime();
                if (isToday) cell.classList.add('today');

                const key = date.getFullYear() + "-" 
                          + String(date.getMonth()+1).padStart(2,'0') + "-" 
                          + String(date.getDate()).padStart(2,'0');
                if (notes[key]) cell.classList.add('has-note');

                const noteText = notes[key] || '';
                cell.innerHTML = `
                    <span class="text-xs sm:text-sm">${date.getMonth()+1}/${date.getDate()}</span>
                    <span class="text-xs text-gray-500 mt-0.5">第${dayNo}天</span>
                    ${noteText ? `<span class="text-[0.6rem] text-red-600 leading-tight truncate w-full text-center">${noteText.length > 8 ? noteText.slice(0,8)+'…' : noteText}</span>` : ''}
                `;

                cell.onclick = () => openModal(date, week, dayNo);
                grid.appendChild(cell);
            }

            function openModal(date, week, dayNo){
                selectedDate = date;
                const key = date.getFullYear() + "-" 
                          + String(date.getMonth()+1).padStart(2,'0') + "-" 
                          + String(date.getDate()).padStart(2,'0');

                modalTitle.innerText = `${date.getMonth()+1}月${date.getDate()}日 第${week}周第${dayNo}天`;
                noteContent.value = notes[key] || '';

                if(notes[key]) deleteNoteBtn.classList.remove('hidden');
                else deleteNoteBtn.classList.add('hidden');

                noteModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }

            function closeModal(){
                noteModal.classList.add('hidden');
                document.body.style.overflow = '';
                selectedDate = null;
            }

            function saveNote(){
                if(!selectedDate) return;
                const key = selectedDate.getFullYear() + "-" 
                          + String(selectedDate.getMonth()+1).padStart(2,'0') + "-" 
                          + String(selectedDate.getDate()).padStart(2,'0');
                const val = noteContent.value.trim();

                if(val) notes[key] = val;
                else delete notes[key];

                localStorage.setItem('calendarNotes', JSON.stringify(notes));
                generateAllWeeks();
                closeModal();
            }

            function delNote(){
                if(!selectedDate) return;
                const key = selectedDate.getFullYear() + "-" 
                          + String(selectedDate.getMonth()+1).padStart(2,'0') + "-" 
                          + String(selectedDate.getDate()).padStart(2,'0');
                delete notes[key];
                localStorage.setItem('calendarNotes', JSON.stringify(notes));
                generateAllWeeks();
                closeModal();
            }

            // ---------- Blood Pressure ----------
            const BP_START_WEEK = 16; // 从6月28日所在周（第16周）开始
            let bpData = JSON.parse(localStorage.getItem('bloodPressureData')) || {};
            let bpSettings = JSON.parse(localStorage.getItem('bpSettings')) || { highLimit: 140, lowLimit: 90 };
            let selectedBpDate = null;

            const bpModal = document.getElementById('bp-modal');
            const bpModalTitle = document.getElementById('bp-modal-title');
            const bpMorningHigh = document.getElementById('bp-morning-high');
            const bpMorningLow = document.getElementById('bp-morning-low');
            const bpEveningHigh = document.getElementById('bp-evening-high');
            const bpEveningLow = document.getElementById('bp-evening-low');
            const saveBpBtn = document.getElementById('save-bp');
            const deleteBpBtn = document.getElementById('delete-bp');
            const closeBpModalBtn = document.getElementById('close-bp-modal');
            const bpSettingsBtn = document.getElementById('bp-settings-btn');
            const bpSettingsPanel = document.getElementById('bp-settings-panel');
            const bpHighLimit = document.getElementById('bp-high-limit');
            const bpLowLimit = document.getElementById('bp-low-limit');
            const bpSaveLimit = document.getElementById('bp-save-limit');
            const bpChartSection = document.getElementById('bp-chart-section');
            const bpChartCanvas = document.getElementById('bp-chart');
            let bpChart = null;

            function getDateKey(date) {
                return date.getFullYear() + "-"
                     + String(date.getMonth()+1).padStart(2,'0') + "-"
                     + String(date.getDate()).padStart(2,'0');
            }

            function getBpClass(reading) {
                if (!reading) return 'missing';
                return (reading.high > bpSettings.highLimit || reading.low > bpSettings.lowLimit) ? 'bp-high' : 'bp-normal';
            }

            function generateBPView() {
                const bpContainer = document.getElementById('bp-container');
                bpContainer.innerHTML = '';
                const dayNames = ['周一','周二','周三','周四','周五','周六','周日'];

                for (let w = BP_START_WEEK; w <= END_WEEK; w++) {
                    let weekStart = new Date(week10Monday);
                    weekStart.setDate(week10Monday.getDate() + (w - 10) * 7);
                    let wrap = document.createElement('div');
                    let title = document.createElement('h3');
                    title.className = 'text-base sm:text-lg font-medium text-gray-700 mb-2';
                    title.innerText = `第${w}周`;
                    wrap.appendChild(title);
                    let grid = document.createElement('div');
                    grid.className = 'bp-grid bg-neutral-dark';

                    ['日期','早上','晚上'].forEach(text => {
                        let h = document.createElement('div');
                        h.className = 'bp-header';
                        h.innerText = text;
                        grid.appendChild(h);
                    });

                    for (let d = 0; d < 7; d++) {
                        let curDate = new Date(weekStart);
                        curDate.setDate(weekStart.getDate() + d);
                        let dayNo = d + 1;
                        const key = getDateKey(curDate);

                        let dateCell = document.createElement('div');
                        dateCell.className = 'bp-cell label-cell';
                        dateCell.innerHTML = `<span class="text-xs text-gray-500">${dayNames[d]}</span><span class="text-xs sm:text-sm font-medium text-gray-800">${curDate.getMonth()+1}/${curDate.getDate()}</span>`;
                        dateCell.onclick = () => openBpModal(curDate, w, dayNo);
                        grid.appendChild(dateCell);

                        let mCell = document.createElement('div');
                        mCell.className = 'bp-cell';
                        const m = bpData[key]?.morning;
                        mCell.innerHTML = `<span class="bp-value ${getBpClass(m)}">${m ? m.high+'/'+m.low : '--/--'}</span>`;
                        mCell.onclick = () => openBpModal(curDate, w, dayNo, 'morning');
                        grid.appendChild(mCell);

                        let eCell = document.createElement('div');
                        eCell.className = 'bp-cell';
                        const e = bpData[key]?.evening;
                        eCell.innerHTML = `<span class="bp-value ${getBpClass(e)}">${e ? e.high+'/'+e.low : '--/--'}</span>`;
                        eCell.onclick = () => openBpModal(curDate, w, dayNo, 'evening');
                        grid.appendChild(eCell);
                    }
                    wrap.appendChild(grid);
                    bpContainer.appendChild(wrap);
                }
                drawBpChart();
            }

            function drawBpChart() {
                const dates = Object.keys(bpData).sort();
                if (bpChart) { bpChart.destroy(); bpChart = null; }
                if (dates.length === 0) return;

                const labels = dates.map(d => {
                    const parts = d.split('-');
                    return `${parseInt(parts[1], 10)}/${parseInt(parts[2], 10)}`;
                });

                const series = [
                    { key: 'morning', part: 'high', label: '早高压', color: '#ef4444' },
                    { key: 'morning', part: 'low', label: '早低压', color: '#f97316' },
                    { key: 'evening', part: 'high', label: '晚高压', color: '#3b82f6' },
                    { key: 'evening', part: 'low', label: '晚低压', color: '#10b981' }
                ];

                const datasets = series.map(s => ({
                    label: s.label,
                    data: dates.map(d => {
                        const reading = bpData[d] && bpData[d][s.key];
                        return reading && reading[s.part] ? reading[s.part] : null;
                    }),
                    borderColor: s.color,
                    backgroundColor: s.color + '20',
                    pointRadius: 3,
                    pointHoverRadius: 5,
                    borderWidth: 2,
                    tension: 0.3,
                    spanGaps: false
                }));

                datasets.push(
                    { label: `高压上限(${bpSettings.highLimit})`, data: dates.map(() => bpSettings.highLimit), borderColor: '#f87171', borderDash: [6, 4], borderWidth: 1, pointRadius: 0, fill: false, tension: 0 },
                    { label: `低压上限(${bpSettings.lowLimit})`, data: dates.map(() => bpSettings.lowLimit), borderColor: '#fb923c', borderDash: [6, 4], borderWidth: 1, pointRadius: 0, fill: false, tension: 0 }
                );

                bpChart = new Chart(bpChartCanvas, {
                    type: 'line',
                    data: { labels, datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 12, padding: 12 } },
                            tooltip: {
                                callbacks: {
                                    label: ctx => ctx.parsed.y !== null ? `${ctx.dataset.label}: ${ctx.parsed.y}` : null
                                }
                            }
                        },
                        scales: {
                            y: { beginAtZero: false, grid: { color: '#f3f4f6' } },
                            x: { grid: { display: false } }
                        }
                    }
                });
            }

            function openBpModal(date, week, dayNo, focus) {
                selectedBpDate = date;
                const key = getDateKey(date);
                bpModalTitle.innerText = `${date.getMonth()+1}月${date.getDate()}日 第${week}周第${dayNo}天`;
                const d = bpData[key] || {};
                bpMorningHigh.value = d.morning?.high || '';
                bpMorningLow.value = d.morning?.low || '';
                bpEveningHigh.value = d.evening?.high || '';
                bpEveningLow.value = d.evening?.low || '';
                deleteBpBtn.classList.toggle('hidden', !d.morning && !d.evening);
                bpModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
                if (focus === 'morning') setTimeout(() => bpMorningHigh.focus(), 100);
                else if (focus === 'evening') setTimeout(() => bpEveningHigh.focus(), 100);
            }

            function closeBpModal() {
                bpModal.classList.add('hidden');
                document.body.style.overflow = '';
                selectedBpDate = null;
            }

            function saveBp() {
                if (!selectedBpDate) return;
                const key = getDateKey(selectedBpDate);
                const mh = parseInt(bpMorningHigh.value);
                const ml = parseInt(bpMorningLow.value);
                const eh = parseInt(bpEveningHigh.value);
                const el = parseInt(bpEveningLow.value);
                if (!bpData[key]) bpData[key] = {};
                if (!isNaN(mh) && !isNaN(ml)) bpData[key].morning = { high: mh, low: ml };
                else delete bpData[key].morning;
                if (!isNaN(eh) && !isNaN(el)) bpData[key].evening = { high: eh, low: el };
                else delete bpData[key].evening;
                if (!bpData[key].morning && !bpData[key].evening) delete bpData[key];
                localStorage.setItem('bloodPressureData', JSON.stringify(bpData));
                generateBPView();
                closeBpModal();
            }

            function delBp() {
                if (!selectedBpDate) return;
                delete bpData[getDateKey(selectedBpDate)];
                localStorage.setItem('bloodPressureData', JSON.stringify(bpData));
                generateBPView();
                closeBpModal();
            }

            // BP Settings
            bpSettingsBtn.onclick = () => {
                bpHighLimit.value = bpSettings.highLimit;
                bpLowLimit.value = bpSettings.lowLimit;
                bpSettingsPanel.classList.toggle('hidden');
            };
            bpSaveLimit.onclick = () => {
                const hl = parseInt(bpHighLimit.value);
                const ll = parseInt(bpLowLimit.value);
                if (!isNaN(hl) && !isNaN(ll) && hl > 0 && ll > 0) {
                    bpSettings.highLimit = hl;
                    bpSettings.lowLimit = ll;
                    localStorage.setItem('bpSettings', JSON.stringify(bpSettings));
                    generateBPView();
                    bpSettingsPanel.classList.add('hidden');
                }
            };

            saveNoteBtn.onclick = saveNote;
            deleteNoteBtn.onclick = delNote;
            closeModalBtn.onclick = closeModal;
            noteModal.onclick = e => { if(e.target === noteModal) closeModal(); };
            saveBpBtn.onclick = saveBp;
            deleteBpBtn.onclick = delBp;
            closeBpModalBtn.onclick = closeBpModal;
            bpModal.onclick = e => { if (e.target === bpModal) closeBpModal(); };
            document.getElementById('bp-chart-toggle-btn').onclick = () => {
                bpChartSection.classList.toggle('hidden');
                if (!bpChartSection.classList.contains('hidden')) drawBpChart();
            };

            // ---------- Growth ----------
            let growthData = JSON.parse(localStorage.getItem('growthData')) || [];
            let selectedGrowthIndex = -1;
            const growthContainer = document.getElementById('growth-container');
            const growthModal = document.getElementById('growth-modal');
            const growthModalTitle = document.getElementById('growth-modal-title');
            const growthDate = document.getElementById('growth-date');
            const growthWeek = document.getElementById('growth-week');
            const growthBpd = document.getElementById('growth-bpd');
            const growthHc = document.getElementById('growth-hc');
            const growthAc = document.getElementById('growth-ac');
            const growthFl = document.getElementById('growth-fl');
            const growthAfd = document.getElementById('growth-afd');
            const growthCl = document.getElementById('growth-cl');
            const growthPl = document.getElementById('growth-pl');
            const saveGrowthBtn = document.getElementById('save-growth');
            const deleteGrowthBtn = document.getElementById('delete-growth');
            const closeGrowthModalBtn = document.getElementById('close-growth-modal');
            const growthAddBtn = document.getElementById('growth-add-btn');
            const growthChartSection = document.getElementById('growth-chart-section');
            const growthChartCanvas = document.getElementById('growth-chart');
            let growthChart = null;

            function generateGrowthView() {
                growthContainer.innerHTML = '';
                if (growthData.length === 0) {
                    growthContainer.innerHTML = '<p class="text-gray-400 text-sm text-center py-8">暂无记录，点击上方"添加"按钮开始记录</p>';
                    growthChartSection.classList.add('hidden');
                    return;
                }
                const sorted = [...growthData].sort((a, b) => a.date.localeCompare(b.date));
                drawGrowthChart(sorted);
                sorted.forEach((item, i) => {
                    const origIndex = growthData.indexOf(item);
                    const prev = i > 0 ? sorted[i - 1] : null;
                    const card = document.createElement('div');
                    card.className = 'bg-white border border-gray-200 rounded-lg p-3 cursor-pointer hover:bg-gray-50 transition-colors';
                    card.onclick = () => openGrowthModal(origIndex);
                    const d = new Date(item.date + 'T00:00:00');
                    const dateStr = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
                    const fields = [
                        { key: 'bpd', label: '双顶径' },
                        { key: 'hc', label: '头围' },
                        { key: 'ac', label: '腹围' },
                        { key: 'fl', label: '股骨长' },
                        { key: 'afd', label: '羊水' },
                        { key: 'cl', label: '宫颈长' },
                        { key: 'pl', label: '胎盘厚' }
                    ];
                    let fieldsHtml = fields.map(f => {
                        const val = item[f.key];
                        let diffHtml = '';
                        if (prev && val && prev[f.key]) {
                            const diff = (parseFloat(val) - parseFloat(prev[f.key])).toFixed(1);
                            const num = parseFloat(diff);
                            if (num > 0) diffHtml = `<span class="text-green-500 text-xs ml-1">+${diff}</span>`;
                            else if (num < 0) diffHtml = `<span class="text-red-500 text-xs ml-1">${diff}</span>`;
                            else diffHtml = `<span class="text-gray-400 text-xs ml-1">0</span>`;
                        }
                        return `<div><span class="text-gray-500">${f.label}:</span> <span class="font-medium">${val || '-'}</span>${diffHtml}</div>`;
                    }).join('');
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-medium text-gray-800">${dateStr}</span>
                            <span class="text-sm text-gray-500">${item.week || '-'}</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-sm">
                            ${fieldsHtml}
                        </div>
                    `;
                    growthContainer.appendChild(card);
                });
            }

            const chartSeries = [
                { key: 'bpd', label: '双顶径', color: '#3b82f6' },
                { key: 'hc', label: '头围', color: '#10b981' },
                { key: 'ac', label: '腹围', color: '#f59e0b' },
                { key: 'fl', label: '股骨长', color: '#ef4444' },
                { key: 'afd', label: '羊水', color: '#8b5cf6' },
                { key: 'cl', label: '宫颈长', color: '#ec4899' },
                { key: 'pl', label: '胎盘厚', color: '#06b6d4' }
            ];

            function drawGrowthChart(sorted) {
                growthChartSection.classList.remove('hidden');
                if (growthChart) { growthChart.destroy(); growthChart = null; }

                const labels = sorted.map(item => {
                    const d = new Date(item.date + 'T00:00:00');
                    return item.week || `${d.getMonth()+1}/${d.getDate()}`;
                });

                const hasData = chartSeries.some(s => sorted.some(item => item[s.key]));
                if (!hasData) { growthChartSection.classList.add('hidden'); return; }

                const datasets = chartSeries.map(s => ({
                    label: s.label,
                    data: sorted.map(item => item[s.key] ? parseFloat(item[s.key]) : null),
                    borderColor: s.color,
                    backgroundColor: s.color + '20',
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    borderWidth: 2,
                    tension: 0.3,
                    spanGaps: false
                }));

                growthChart = new Chart(growthChartCanvas, {
                    type: 'line',
                    data: { labels, datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 12, padding: 12 } },
                            tooltip: {
                                callbacks: {
                                    label: ctx => ctx.parsed.y !== null ? `${ctx.dataset.label}: ${ctx.parsed.y}` : null
                                }
                            }
                        },
                        scales: {
                            y: { beginAtZero: false, grid: { color: '#f3f4f6' } },
                            x: { grid: { display: false } }
                        }
                    }
                });
            }

            function openGrowthModal(index) {
                selectedGrowthIndex = index;
                if (index >= 0) {
                    const item = growthData[index];
                    growthModalTitle.innerText = '编辑成长记录';
                    growthDate.value = item.date;
                    growthWeek.value = item.week || '';
                    growthBpd.value = item.bpd || '';
                    growthHc.value = item.hc || '';
                    growthAc.value = item.ac || '';
                    growthFl.value = item.fl || '';
                    growthAfd.value = item.afd || '';
                    growthCl.value = item.cl || '';
                    growthPl.value = item.pl || '';
                    deleteGrowthBtn.classList.remove('hidden');
                } else {
                    growthModalTitle.innerText = '添加成长记录';
                    growthDate.value = '';
                    growthWeek.value = '';
                    growthBpd.value = '';
                    growthHc.value = '';
                    growthAc.value = '';
                    growthFl.value = '';
                    growthAfd.value = '';
                    growthCl.value = '';
                    growthPl.value = '';
                    deleteGrowthBtn.classList.add('hidden');
                }
                growthModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }

            function closeGrowthModal() {
                growthModal.classList.add('hidden');
                document.body.style.overflow = '';
                selectedGrowthIndex = -1;
            }

            function saveGrowth() {
                const date = growthDate.value;
                if (!date) { alert('请选择检查日期'); return; }
                const record = {
                    date,
                    week: growthWeek.value.trim(),
                    bpd: growthBpd.value,
                    hc: growthHc.value,
                    ac: growthAc.value,
                    fl: growthFl.value,
                    afd: growthAfd.value,
                    cl: growthCl.value,
                    pl: growthPl.value
                };
                if (selectedGrowthIndex >= 0) {
                    growthData[selectedGrowthIndex] = record;
                } else {
                    growthData.push(record);
                }
                localStorage.setItem('growthData', JSON.stringify(growthData));
                generateGrowthView();
                closeGrowthModal();
            }

            function deleteGrowth() {
                if (selectedGrowthIndex >= 0) {
                    growthData.splice(selectedGrowthIndex, 1);
                    localStorage.setItem('growthData', JSON.stringify(growthData));
                    generateGrowthView();
                    closeGrowthModal();
                }
            }

            growthAddBtn.onclick = () => openGrowthModal(-1);
            saveGrowthBtn.onclick = saveGrowth;
            deleteGrowthBtn.onclick = deleteGrowth;
            closeGrowthModalBtn.onclick = closeGrowthModal;
            growthModal.onclick = e => { if (e.target === growthModal) closeGrowthModal(); };

            // ---------- Baby Checklist ----------
            const DEFAULT_CATEGORIES = [
            ];

            const DEFAULT_ITEMS = [
            ];

            let checklistData = JSON.parse(localStorage.getItem('babyChecklist')) || null;
            if (!checklistData || !checklistData.categories) {
                const oldDone = (checklistData && checklistData.done) || {};
                const oldCustom = (checklistData && checklistData.customItems) || [];
                checklistData = {
                    categories: DEFAULT_CATEGORIES.map(c => ({...c})),
                    items: [
                        ...DEFAULT_ITEMS.map(i => ({...i})),
                        ...oldCustom.map(c => ({ id: c.id, cat: c.category, name: c.name }))
                    ],
                    done: oldDone
                };
                localStorage.setItem('babyChecklist', JSON.stringify(checklistData));
            }

            const checklistContainer = document.getElementById('checklist-container');
            const checklistProgress = document.getElementById('checklist-progress');
            const checklistModal = document.getElementById('checklist-modal');
            const checklistCategory = document.getElementById('checklist-category');
            const checklistItemName = document.getElementById('checklist-item-name');
            const saveChecklistItemBtn = document.getElementById('save-checklist-item');
            const closeChecklistModalBtn = document.getElementById('close-checklist-modal');
            const checklistAddBtn = document.getElementById('checklist-add-btn');

            function saveChecklistData() {
                localStorage.setItem('babyChecklist', JSON.stringify(checklistData));
            }

            function renderCategorySelect() {
                checklistCategory.innerHTML = '';
                checklistData.categories.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.key;
                    opt.textContent = c.name;
                    checklistCategory.appendChild(opt);
                });
            }

            renderCategorySelect();

            function generateChecklistView() {
                checklistContainer.innerHTML = '';
                let totalDone = 0;
                let totalItems = 0;

                checklistData.categories.forEach(cat => {
                    const catItems = checklistData.items.filter(i => i.cat === cat.key);
                    if (catItems.length === 0) return;

                    const catDone = catItems.filter(item => checklistData.done[item.id]).length;
                    totalDone += catDone;
                    totalItems += catItems.length;

                    const section = document.createElement('div');
                    section.className = 'bg-white border border-gray-200 rounded-lg p-3';

                    const header = document.createElement('div');
                    header.className = 'flex items-center justify-between mb-2';
                    header.innerHTML = `
                        <span class="font-medium text-gray-800">${cat.name}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-gray-400">${catDone}/${catItems.length}</span>
                            <button class="cat-edit text-gray-300 hover:text-blue-500 transition-colors text-xs" title="编辑分类"><i class="fa fa-pencil"></i></button>
                            <button class="cat-del text-gray-300 hover:text-red-500 transition-colors text-xs" title="删除分类"><i class="fa fa-trash-o"></i></button>
                        </div>
                    `;
                    header.querySelector('.cat-edit').onclick = () => editCategory(cat.key);
                    header.querySelector('.cat-del').onclick = () => deleteCategory(cat.key);
                    section.appendChild(header);

                    catItems.forEach(item => {
                        const row = document.createElement('div');
                        row.className = 'flex items-center gap-2 py-1.5 border-t border-gray-100 first:border-t-0';
                        const isChecked = !!checklistData.done[item.id];

                        row.innerHTML = `
                            <input type="checkbox" ${isChecked ? 'checked' : ''} class="checklist-cb w-4 h-4 text-primary rounded border-gray-300 focus:ring-primary cursor-pointer">
                            <span class="text-sm flex-1 ${isChecked ? 'line-through text-gray-400' : 'text-gray-700'}">${item.name}</span>
                            <button class="item-edit text-gray-300 hover:text-blue-500 transition-colors text-xs" title="编辑"><i class="fa fa-pencil"></i></button>
                            <button class="item-del text-gray-300 hover:text-red-500 transition-colors text-xs" title="删除"><i class="fa fa-times"></i></button>
                        `;

                        row.querySelector('.checklist-cb').onchange = (e) => {
                            if (e.target.checked) checklistData.done[item.id] = new Date().toISOString();
                            else delete checklistData.done[item.id];
                            saveChecklistData();
                            generateChecklistView();
                        };
                        row.querySelector('.item-edit').onclick = () => editItem(item.id);
                        row.querySelector('.item-del').onclick = () => deleteItem(item.id);

                        section.appendChild(row);
                    });

                    const addItemRow = document.createElement('div');
                    addItemRow.className = 'border-t border-gray-100 pt-2 mt-1';
                    addItemRow.innerHTML = `<button class="add-in-cat text-xs text-gray-400 hover:text-primary transition-colors"><i class="fa fa-plus"></i> 添加物品</button>`;
                    addItemRow.querySelector('.add-in-cat').onclick = () => {
                        checklistCategory.value = cat.key;
                        openChecklistModal();
                    };
                    section.appendChild(addItemRow);

                    checklistContainer.appendChild(section);
                });

                if (totalItems === 0) {
                    checklistContainer.innerHTML = '<p class="text-gray-400 text-sm text-center py-8">暂无物品，点击上方"添加"开始</p>';
                }

                checklistProgress.innerHTML = totalItems > 0
                    ? `<div class="flex items-center gap-2 text-sm"><span class="font-medium text-gray-700">已完成 ${totalDone}/${totalItems}</span><div class="flex-1 bg-gray-200 rounded-full h-2"><div class="h-full bg-primary rounded-full transition-all duration-300" style="width:${(totalDone/totalItems*100).toFixed(0)}%"></div></div></div>`
                    : '';
            }

            function openChecklistModal() {
                checklistItemName.value = '';
                checklistModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }

            function closeChecklistModal() {
                checklistModal.classList.add('hidden');
                document.body.style.overflow = '';
            }

            function saveChecklistItem() {
                const name = checklistItemName.value.trim();
                if (!name) return;
                const cat = checklistCategory.value;
                checklistData.items.push({ id: 'item-' + Date.now(), cat, name });
                saveChecklistData();
                generateChecklistView();
                closeChecklistModal();
            }

            function addCategory() {
                const name = prompt('输入新分类名称：');
                if (!name || !name.trim()) return;
                checklistData.categories.push({ key: 'cat-' + Date.now(), name: name.trim() });
                saveChecklistData();
                renderCategorySelect();
                generateChecklistView();
            }

            function editCategory(key) {
                const cat = checklistData.categories.find(c => c.key === key);
                if (!cat) return;
                const name = prompt('修改分类名称：', cat.name);
                if (!name || !name.trim()) return;
                cat.name = name.trim();
                saveChecklistData();
                renderCategorySelect();
                generateChecklistView();
            }

            function deleteCategory(key) {
                const cat = checklistData.categories.find(c => c.key === key);
                if (!cat) return;
                const count = checklistData.items.filter(i => i.cat === key).length;
                const msg = count > 0 ? `确定删除分类"${cat.name}"？\n该分类下 ${count} 个物品也将被删除。` : `确定删除分类"${cat.name}"？`;
                if (!confirm(msg)) return;
                checklistData.items.filter(i => i.cat === key).forEach(i => { delete checklistData.done[i.id]; });
                checklistData.items = checklistData.items.filter(i => i.cat !== key);
                checklistData.categories = checklistData.categories.filter(c => c.key !== key);
                saveChecklistData();
                renderCategorySelect();
                generateChecklistView();
            }

            function editItem(id) {
                const item = checklistData.items.find(i => i.id === id);
                if (!item) return;
                const name = prompt('修改物品名称：', item.name);
                if (!name || !name.trim()) return;
                item.name = name.trim();
                saveChecklistData();
                generateChecklistView();
            }

            function deleteItem(id) {
                if (!confirm('确定删除该物品？')) return;
                checklistData.items = checklistData.items.filter(i => i.id !== id);
                delete checklistData.done[id];
                saveChecklistData();
                generateChecklistView();
            }

            checklistAddBtn.onclick = openChecklistModal;
            saveChecklistItemBtn.onclick = saveChecklistItem;
            closeChecklistModalBtn.onclick = closeChecklistModal;
            checklistModal.onclick = e => { if (e.target === checklistModal) closeChecklistModal(); };
            document.getElementById('checklist-manage-btn').onclick = addCategory;

            document.onkeydown = e => {
                if(e.key === 'Escape') {
                    if (!noteModal.classList.contains('hidden')) closeModal();
                    if (!bpModal.classList.contains('hidden')) closeBpModal();
                    if (!growthModal.classList.contains('hidden')) closeGrowthModal();
                    if (!checklistModal.classList.contains('hidden')) closeChecklistModal();
                }
            };

            // Tab switching
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden-panel'));
                    document.getElementById('tab-panel-' + btn.dataset.tab).classList.remove('hidden-panel');
                };
            });

            function getGestationalInfo() {
                const lmp = new Date(week10Monday);
                lmp.setDate(week10Monday.getDate() - 63);
                const edd = new Date(lmp);
                edd.setDate(lmp.getDate() + 280);
                const gestationalDays = Math.max(0, Math.floor((today - lmp) / 86400000));
                return {
                    week: Math.floor(gestationalDays / 7),
                    day: gestationalDays % 7,
                    edd,
                    daysLeft: Math.floor((edd - today) / 86400000),
                    progress: Math.max(0, Math.min(1, gestationalDays / 280))
                };
            }

            function renderPregnancyStats() {
                const info = getGestationalInfo();
                document.getElementById('preg-week').innerText = `已孕 ${info.week}周${info.day}天`;
                const eddStr = `${info.edd.getFullYear()}年${info.edd.getMonth()+1}月${info.edd.getDate()}日`;
                document.getElementById('preg-edd').innerText = `预产期 ${eddStr}`;
                document.getElementById('preg-countdown').innerText = info.daysLeft >= 0 ? `距预产期 ${info.daysLeft} 天` : `已超过预产期 ${-info.daysLeft} 天`;
                document.getElementById('preg-progress').style.width = (info.progress * 100).toFixed(1) + '%';
            }

            generateAllWeeks();
            generateBPView();
            generateGrowthView();
            checkReminders();
            renderPregnancyStats();
            generateChecklistView();

            function checkReminders() {
                const banner = document.getElementById('reminder-banner');
                banner.innerHTML = '';
                const reminders = [];
                const todayKey = getDateKey(today);

                // BP reminder
                const currentWeekNum = Math.floor((today - week10Monday) / (7 * 86400000)) + 10;
                if (currentWeekNum >= BP_START_WEEK) {
                    const todayBp = bpData[todayKey];
                    if (!todayBp || !todayBp.morning) {
                        reminders.push({ icon: 'fa-heartbeat', text: '今天还没有记录早晨血压', color: 'bg-orange-50 border-orange-200 text-orange-700', iconColor: 'text-orange-500' });
                    }
                    if (!todayBp || !todayBp.evening) {
                        const hour = new Date().getHours();
                        if (hour >= 18) {
                            reminders.push({ icon: 'fa-heartbeat', text: '今天还没有记录晚间血压', color: 'bg-orange-50 border-orange-200 text-orange-700', iconColor: 'text-orange-500' });
                        }
                    }
                }

                // Note reminder - 1 day before
                const tomorrow = new Date(today);
                tomorrow.setDate(today.getDate() + 1);
                const tomorrowKey = getDateKey(tomorrow);
                if (notes[tomorrowKey]) {
                    const preview = notes[tomorrowKey].length > 20 ? notes[tomorrowKey].slice(0, 20) + '...' : notes[tomorrowKey];
                    reminders.push({ icon: 'fa-sticky-note', text: `明天有备注：${preview}`, color: 'bg-yellow-50 border-yellow-200 text-yellow-700', iconColor: 'text-yellow-500' });
                }

                // Growth check reminder
                if (growthData.length > 0) {
                    const sorted = [...growthData].sort((a, b) => b.date.localeCompare(a.date));
                    const lastCheck = sorted[0];
                    const lastDate = new Date(lastCheck.date + 'T00:00:00');
                    const daysSince = Math.floor((today - lastDate) / 86400000);
                    if (daysSince >= 28) {
                        reminders.push({ icon: 'fa-calendar-check-o', text: `距离上次B超检查已过 ${daysSince} 天，建议安排下一次检查`, color: 'bg-blue-50 border-blue-200 text-blue-700', iconColor: 'text-blue-500' });
                    }
                }

                if (reminders.length === 0) {
                    banner.classList.add('hidden');
                    return;
                }

                reminders.forEach(r => {
                    const div = document.createElement('div');
                    div.className = `flex items-center gap-3 p-3 rounded-lg border ${r.color}`;
                    div.innerHTML = `<i class="fa ${r.icon} ${r.iconColor} text-lg"></i><span class="text-sm font-medium">${r.text}</span>`;
                    banner.appendChild(div);
                });
                banner.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
